<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investors Pass - Front & Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-top:#946230;
    --brown-mid:#82521f;
    --brown-bot:#5f3817;
    --cream:#f4e4bc;
    --ink:#3a210d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:#ffffff;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    gap:70px;padding:40px 20px;flex-wrap:wrap;
  }
  .card{
    position:relative;width:336px;height:540px;
    border-radius:16px;overflow:hidden;
    box-shadow:0 14px 30px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18);
  }
  .slot{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:67px;height:17px;background:#fff;border-radius:9px;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.25);z-index:20;
  }
  .noise{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .34 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- FRONT ---------- */
  .front{
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .16  0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(circle at 82% 16%, rgba(255,252,240,.65), transparent 48%),
      radial-gradient(circle at 40% 72%, rgba(196,160,104,.22), transparent 46%),
      linear-gradient(180deg,#ecdfc2 0%,#f2e8d2 38%,#efe2c8 100%);
  }
  .white-fiber{
    position:absolute;inset:0;z-index:1;
    background:#f7f2e7;
    clip-path:polygon(
      26% 59%, 31% 58.5%, 34% 61%, 34.5% 65%, 33.5% 68%, 34.5% 71%, 32.5% 73.5%, 28% 72%, 25% 68%, 24.5% 63%
    );
  }
  .white-fiber2{
    position:absolute;inset:0;z-index:1;
    background:#f7f2e7;
    clip-path:polygon(37% 84%, 39% 86%, 40.8% 91%, 41.2% 94.5%, 39.2% 94%, 38% 90%);
  }
  .strip-wrap{
    position:absolute;inset:0;z-index:2;
    filter:drop-shadow(1.5px 0 2px rgba(60,35,10,.5));
  }
  .strip{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 6px),
      linear-gradient(90deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,0) 22%),
      linear-gradient(180deg,#9b6733 0%,#8a5826 40%,#7a4a1d 72%,#5f3817 100%);
    clip-path:polygon(
      0 0, 30.4% 0, 31% 3.3%, 30% 6.2%, 32.2% 8.1%, 31.4% 10%, 32.7% 12.8%, 31% 15.6%,
      28.5% 17.2%, 33% 19%, 36.4% 21.5%, 35.5% 23.5%, 33.7% 26%, 32.2% 27.5%, 34% 29.5%,
      31.8% 32%, 31% 34.5%, 33% 36%, 34.7% 37.5%, 33.5% 39.5%, 32.2% 41.5%, 33.5% 44%,
      35% 47%, 34.8% 50.5%, 36.3% 52.5%, 35.2% 55%, 33% 57%, 30.3% 59%, 27.6% 62%,
      25.2% 62.8%, 29% 65%, 33% 66.5%, 31.8% 69%, 31.2% 72%, 33.5% 75%, 35% 78%,
      35.6% 81%, 37.4% 85%, 39% 89.5%, 39.6% 94%, 39.6% 100%, 0 100%
    );
  }
  .front .logo-top{position:absolute;top:8px;right:14px;z-index:6}
  .front .logo-top img{display:block;width:78px;height:auto}
  .vertical-title{
    position:absolute;left:17px;top:11%;height:69%;
    writing-mode:vertical-rl;transform:rotate(180deg);
    display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:800;letter-spacing:1px;
    color:var(--ink);z-index:6;white-space:nowrap;
    text-shadow:0 1px 0 rgba(255,210,150,.18);
  }
  .avatar{
    position:absolute;left:66%;top:41.5%;
    width:132px;height:132px;transform:translate(-50%,-50%);
    border-radius:50%;background:#dcdcdc;overflow:hidden;z-index:4;
  }
  .avatar svg{width:100%;height:100%;display:block}
  .name{
    position:absolute;left:66%;top:82.5%;transform:translate(-50%,-50%);
    font-size:23px;font-weight:700;color:#3f3a36;white-space:nowrap;
    letter-spacing:.1px;z-index:6;line-height:1;
  }
  .bar{
    position:absolute;left:7px;right:6px;bottom:0;height:32px;
    border-radius:26px 26px 14px 14px;
    background:linear-gradient(180deg,#6d3f16 0%,#4f2d10 100%);
    display:flex;align-items:center;justify-content:center;
    color:var(--cream);font-size:16px;font-weight:700;letter-spacing:1.2px;
    z-index:8;line-height:1;
    box-shadow:0 -1px 3px rgba(0,0,0,.2);
  }

  /* ---------- BACK ---------- */
  .back{
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 2px,transparent 2px 7px),
      radial-gradient(ellipse at 50% 34%, #bb864a 0%, #a56e36 46%, #8a5726 100%);
  }
  .back .vign{
    position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(60,30,8,.28) 0%,rgba(60,30,8,0) 18%,rgba(60,30,8,0) 82%,rgba(60,30,8,.28) 100%);
  }
  .orn{
    position:absolute;left:0;right:0;top:53%;height:41%;width:100%;
  }
  .back .big-logo{position:absolute;left:50%;top:15.1%;transform:translateX(-50%)}
  .back .big-logo img{display:block;width:160px;height:auto;filter:drop-shadow(0 1px 1px rgba(255,220,170,.15))}
  .back .title{
    position:absolute;left:0;right:0;top:43.6%;text-align:center;
    font-size:50px;font-weight:800;line-height:45px;color:var(--ink);
    letter-spacing:.2px;
    text-shadow:0 1px 0 rgba(255,214,150,.22);
  }
  .back .auth{
    position:absolute;left:7.5%;right:7.5%;top:74%;height:31px;
    border-radius:16px;
    background:rgba(84,50,20,.72);
    border:1.5px solid rgba(58,33,13,.75);
    display:flex;align-items:center;justify-content:center;
    color:#3c2410;font-size:11.5px;font-weight:700;letter-spacing:.5px;white-space:nowrap;
    z-index:5;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  }
  .back .bar{left:6px;right:6px}
</style>
</head>
